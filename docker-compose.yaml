services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      # Use the Docker internal DNS network service name 'db' instead of 'localhost'
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      # Use host.docker.internal to bridge to Ollama running on your Windows host
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_MODEL=qwen3:8b
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
    extra_hosts:
      # Bulletproof resolution for host.docker.internal inside Linux containers
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy # Wait for the DB to be fully healthy before starting the API

volumes:
  pgdata: