services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: rag-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006" # Phoenix UI and OTLP HTTP collector (/v1/traces)
      - "4317:4317" # OTLP gRPC collector
    environment:
      # Persist traces/projects so they survive container restarts
      - PHOENIX_WORKING_DIR=/mnt/phoenix
    volumes:
      - phoenixdata:/mnt/phoenix

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      # Use the Docker internal DNS network service name 'db' instead of 'localhost'
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      # Use host.docker.internal to bridge to Ollama running on your Windows host
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_MODEL=qwen3:8b
      - EMBEDDING_MODEL=/app/models/bge-small-en-v1.5
      # Send OTLP spans to the Phoenix container over the compose network
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    extra_hosts:
      # Bulletproof resolution for host.docker.internal inside Linux containers
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy # Wait for the DB to be fully healthy before starting the API
      phoenix:
        condition: service_started

volumes:
  pgdata:
  phoenixdata: